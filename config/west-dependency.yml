manifest:
  version: 1.2
  defaults:
    remote: cormoran
    revision: main
  remotes:
    - name: cormoran
      url-base: https://github.com/cormoran
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    # Build command extension: provides `west zmk-build` and friends
    - name: zmk-west-commands
      import: true

    # ZMK main repo: uses cormoran's fork, main+dya branch
    # That branch = ZMK main + custom Studio RPC protocol + every firmware change DYA Studio needs
    - name: zmk
      import:
        file: app/west.yml
      clone-depth: 1
      revision: main+dya

    # Zephyr: use the branch with nRF half-duplex UART support
    - name: zephyr
      revision: v4.1.0+zmk-fixes+nrf-half-duplex-uart
      clone-depth: 1
      import:
        name-blocklist:
          - ci-tools
          - hal_altera
          - hal_cypress
          - hal_infineon
          - hal_microchip
          - hal_nxp
          - hal_openisa
          - hal_st
          - hal_xtensa
          - hal_ti
          - loramac-node
          - mcuboot
          - mcumgr
          - net-tools
          - openthread
          - edtt
          - trusted-firmware-m

    # ---------------------------------------------------------------------
    # DYA Studio extension module stack
    # Each entry maps to one feature page in the DYA Studio web UI
    # ---------------------------------------------------------------------

    # Connection management: BLE profile rename / switch / unpair
    - name: zmk-module-ble-management
    # Device settings: power management, Zephyr settings read/write
    - name: zmk-module-settings-rpc
    # Custom settings: expose plain Zephyr settings for web editing
    - name: zmk-feature-custom-settings
    # Host OS detection (Windows / macOS / Linux / iOS / Android)
    - name: zmk-feature-os-detection
    # Auto-switch the default layer per peer / per OS
    # Note: default-layer's main branch lags behind the branch DYA2 actually uses,
    # so this pins the same revision as zmk-keyboard-dya2
    - name: zmk-feature-default-layer
      revision: codex/custom-rpc-rewrite
      import: true
    # Runtime macros: create macros on the web without rebuilding
    - name: zmk-feature-runtime-macro
    # Runtime combos
    - name: zmk-feature-runtime-combo
    # Input stream: stream key events in real time (DYA Studio key highlighting)
    - name: zmk-feature-input-stream
    # Physical layout: lets DYA Studio draw the keyboard correctly on the web
    - name: zmk-feature-module-physical-layout
    # Input processors: runtime tuning of mouse / wheel / scrolling
    - name: zmk-module-runtime-input-processor
    # Fast keymap: incremental keymap sync, avoiding large data transfers
    - name: zmk-feature-fast-keymap
    # Device info: firmware version, uptime, per-half information
    - name: zmk-feature-device-info
    # Chatter diagnostics: per-key debounce detection
    - name: zmk-feature-kscan-diagnostics
    # Watchdog: freeze logging
    - name: zmk-feature-watchdog
    # Battery history chart
    - name: zmk-module-battery-history

  self:
    path: config
