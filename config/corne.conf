# Corne common configuration (left / right hand, shared by all display variants)
#
# ZMK applies this file to both corne_left / corne_right (the user config has highest precedence).
# Put here only settings **both halves need**; the per-half settings live in:
#
#   boards/shields/corne/corne_left.conf    left = central: Studio / RPC /
#                                          OS detection / default layer / extension modules
#   boards/shields/corne/corne_right.conf   right = peripheral: receives / applies settings
#
# ⚠️ Do NOT set CONFIG_ZMK_SPLIT_ROLE_CENTRAL here: it would apply to both halves at once,
#   making the right half central too and breaking the split. The split role is set in Kconfig.defconfig.
#
# ⚠️ Do NOT set ZMK_STUDIO or any *_STUDIO_RPC here: the peripheral half does not have
#   ZMK_STUDIO_RPC (protobuf stubs are not generated); forcing it on fails the build with a missing custom.pb.h.
#
# The display (OLED / nice!view) is selected by the build.yaml snippets; this file does not enable
# CONFIG_ZMK_DISPLAY.

# Bluetooth device name (<=16 bytes; set in the user conf to deterministically override the defconfig default)
CONFIG_ZMK_KEYBOARD_NAME="Corne DYA"

# Bluetooth TX power +8dBm
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

#
# Battery
#
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORTING_FETCH_MODE_STATE_OF_CHARGE=y
# The split battery proxy is central-only (ZMK_SPLIT_BLE_CENTRAL_*); it was moved to
# boards/shields/corne/corne_left.conf; keeping it here would produce
# "assigned ... but got ''" Kconfig warnings on the peripheral half.

#
# Bluetooth profile counts
#
# One extra profile (+1 reserved for the peripheral; the right side only uses a bit more RAM, no functional impact)
CONFIG_BT_MAX_CONN=5
CONFIG_BT_MAX_PAIRED=5

#
# Power management (adjustable live on the DYA Studio web page, delivered via settings RPC)
#
CONFIG_ZMK_SLEEP=y
# 30s
CONFIG_ZMK_IDLE_TIMEOUT=30000
# 30min
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1800000

#
# Settings provided by the cormoran/zmk fork
#
# Half-duplex UART (wired split connection)
# ⚠️ ZMK_SPLIT_WIRED_UART_MODE_* is a choice that only exists when ZMK_SPLIT_WIRED is
#    enabled (i.e. when the wired split snippet/config is in use). Hardcoding it here
#    would produce a "choice symbol ... was selected but no symbol ended up as the choice
#    selection" warning without wired split enabled, so it stays commented out; uncomment it if a wired connection is ever used.
# CONFIG_ZMK_SPLIT_WIRED_UART_MODE_INTERRUPT=y
# Inter-half event relay: setting changes are synced from the central to the peripheral half
CONFIG_ZMK_SPLIT_RELAY_EVENT=y
# Zephyr 4.x enables CONSOLE by default; disabled here to save flash
# When troubleshooting, `west zmk-build -a corne_left -S zmk-usb-logging --flash`
# temporarily builds a logging firmware (extra flash usage only; the daily firmware is unaffected).
CONFIG_CONSOLE=n

#
# Resource & protocol tuning (shared by both halves; central-only RPC buffers/stacks live in corne_left.conf)
#

# Shorten the settings persistence debounce to reduce the risk of losing data after editing settings
# Note: this increases the flash write frequency
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000

# Thread stacks (central-only split run stack and Studio RPC buffers/stacks live in corne_left.conf)
CONFIG_ZMK_LOW_PRIORITY_THREAD_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_ZMK_SPLIT_RELAY_EVENT_DATA_LEN=240
CONFIG_ZMK_CUSTOM_SETTINGS_LARGE_VALUE_MAX_SIZE=256
