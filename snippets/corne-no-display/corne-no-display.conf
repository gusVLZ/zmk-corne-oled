# Disable the Corne onboard OLED (SSD1306)
#
# Purpose 1: no-display build — display stays off, the SSD1306 driver is not compiled in, saving flash.
# Purpose 2: nice!view build — the onboard OLED and nice!view are either/or;
#         nice_view.overlay points zephyr,display at nice_view,
#         but the SSD1306 driver would still be compiled in, so it is explicitly disabled here.
#
# `zephyr,display = &oled` in corne.dtsi is hardcoded;
# without this snippet the SSD1306 driver is compiled in even when the display is off.
CONFIG_SSD1306=n
