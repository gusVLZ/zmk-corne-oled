# Left hand = central (the master half)
#
# Pulled in via `snippets:` of every left-hand variant in build.yaml (`-S corne-central`).
#
# ⚠️ Why not boards/shields/corne/corne_left.conf?
#    Zephyr's SHIELD_ROOT resolves to only the **first** board root that contains the shield,
#    and ZMK's app/boards comes first, so a <shield>.conf placed under this repo's
#    boards/ is never read (verified: the log shows
#    dependencies/zmk/app/boards/shields/corne/corne_left.conf, an empty file).
#    Kconfig.defconfig works because Zephyr osources every board root.
#    Snippets go through EXTRA_CONF_FILE, verified to work, and are **explicit assignments**:
#    unmet dependencies raise a clear warning instead of being silently dropped like `default y` in a defconfig.
#
#    No central-only symbol may ever appear in a file shared by both halves:
#    Studio's protobuf stubs are generated on the central only; enabling them on the right half
#    fails the build with a missing proto/zmk/custom.pb.h. Splitting per half into two snippets isolates them naturally.

#
# ZMK Studio
#
CONFIG_ZMK_STUDIO=y

#
# Device settings: settings read/write (right half only receives / applies)
# https://github.com/cormoran/zmk-module-settings-rpc
#
CONFIG_ZMK_SETTINGS_RPC=y
CONFIG_ZMK_SETTINGS_RPC_STUDIO=y

#
# Custom settings: expose plain Zephyr settings on the settings-sync chain
# https://github.com/cormoran/zmk-feature-custom-settings
#
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_STUDIO_RPC=y
# Split: relay setting changes from central to the peripheral half
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

#
# Split battery proxy (central reads peripheral battery levels and reports them together)
#
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y

#
# Host OS detection (Windows / macOS / Linux / iOS / Android)
# https://github.com/cormoran/zmk-feature-os-detection
#
CONFIG_ZMK_OS_DETECTION=y
CONFIG_ZMK_OS_DETECTION_USB=y
CONFIG_ZMK_OS_DETECTION_BLE=y
CONFIG_ZMK_OS_DETECTION_STUDIO_RPC=y

#
# Default-layer module (closed range 0-3, 4 layers total)
# https://github.com/cormoran/zmk-feature-default-layer
#
# The panel defaults to UNSET for everything, i.e. the base layer is unchanged. The keymap keeps
# an `&mo 0` fallback on both LOWER and ADJUST, so even if it is changed to 1 or 3 you can still get back to LAYER_0 — the keyboard never locks itself out.
CONFIG_ZMK_DEFAULT_LAYER=y
CONFIG_ZMK_DEFAULT_LAYER_MIN_INDEX=0
CONFIG_ZMK_DEFAULT_LAYER_MAX_INDEX=3
CONFIG_ZMK_DEFAULT_LAYER_STUDIO_RPC=y
CONFIG_ZMK_DEFAULT_LAYER_OS_DETECTION=y

#
# Connection management: BLE profile rename / switch / unpair, USB vs Bluetooth priority
# https://github.com/cormoran/zmk-module-ble-management
#
CONFIG_ZMK_BLE_MANAGEMENT=y
CONFIG_ZMK_BLE_MANAGEMENT_STUDIO_RPC=y

#
# Input processors: runtime tuning of mouse / wheel / scrolling
# https://github.com/cormoran/zmk-module-runtime-input-processor
#
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR=y
CONFIG_ZMK_RUNTIME_INPUT_PROCESSOR_STUDIO_RPC=y

#
# Input stream: stream key events in real time (DYA Studio key highlighting)
# https://github.com/cormoran/zmk-feature-input-stream
#
CONFIG_ZMK_INPUT_STREAM_FEATURE=y
CONFIG_ZMK_INPUT_STREAM_FEATURE_STUDIO_RPC=y

#
# Physical layout: lets DYA Studio draw the keyboard correctly on the web
# https://github.com/cormoran/zmk-feature-module-physical-layout
#
# This shield's own layout comes from the ZMK fork's built-in
# app/dts/layouts/foostan/corne/6column.dtsi (chosen in corne.dtsi as
# foostan_corne_6col_layout), so no extra dtsi is needed in this repo.
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE=y
CONFIG_ZMK_PHYSICAL_LAYOUTS_FEATURE_STUDIO_RPC=y

#
# Fast keymap: incremental keymap sync, avoiding large data transfers
# https://github.com/cormoran/zmk-feature-fast-keymap
#
CONFIG_ZMK_FAST_KEYMAP=y
CONFIG_ZMK_FAST_KEYMAP_STUDIO_RPC=y
CONFIG_ZMK_FAST_KEYMAP_DEFAULT_LAYER=y

#
# Runtime macros / combos: create them on the web without rebuilding
# https://github.com/cormoran/zmk-feature-runtime-macro
# https://github.com/cormoran/zmk-feature-runtime-combo
#
CONFIG_ZMK_RUNTIME_MACRO=y
CONFIG_ZMK_RUNTIME_MACRO_STUDIO_RPC=y
CONFIG_ZMK_RUNTIME_COMBO=y
CONFIG_ZMK_RUNTIME_COMBO_STUDIO_RPC=y

# Behavior local-ID encoding scheme.
# This is a choice that follows ZMK_STUDIO_RPC select ZMK_BEHAVIOR_LOCAL_IDS,
# with **no default** — if not set explicitly, Kconfig auto-selects the first member,
# ZMK_BEHAVIOR_LOCAL_ID_TYPE_SETTINGS_TABLE, while the DYA Studio web app computes
# behavior ids with CRC16. A mismatch makes bindings written by Macros / Combos /
# Keymap Editor miss the existing keys (it looks like "edits have no effect" or a scrambled keymap).
# See the matching note in boards/shields/corne/corne_left.conf and the README.
CONFIG_ZMK_BEHAVIOR_LOCAL_ID_TYPE_CRC16=y

#
# Device info: firmware version, uptime, per-half information
# https://github.com/cormoran/zmk-feature-device-info
#
CONFIG_ZMK_DEVICE_INFO=y
CONFIG_ZMK_DEVICE_INFO_STUDIO_RPC=y

#
# Chatter diagnostics: per-key debounce detection
# https://github.com/cormoran/zmk-feature-kscan-diagnostics
#
CONFIG_ZMK_KSCAN_DIAGNOSTICS=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_STUDIO_RPC=y
CONFIG_ZMK_KSCAN_DIAGNOSTICS_SPLIT=y

#
# Watchdog: freeze logging
# https://github.com/cormoran/zmk-feature-watchdog
#
CONFIG_ZMK_WATCHDOG=y
CONFIG_ZMK_WATCHDOG_STUDIO_RPC=y
CONFIG_ZMK_WATCHDOG_SPLIT_RELAY=y
CONFIG_ZMK_WATCHDOG_FREEZE_DETECT=y

#
# Studio RPC buffers / stacks
#
CONFIG_ZMK_STUDIO_RPC_RX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_TX_BUF_SIZE=256
CONFIG_ZMK_STUDIO_RPC_CUSTOM_SUBSYSTEM_REQUEST_PAYLOAD_MAX_BYTES=256
CONFIG_ZMK_STUDIO_RPC_THREAD_STACK_SIZE=6000
# Central's split run stack (the peripheral half does not depend on this symbol)
CONFIG_ZMK_SPLIT_BLE_CENTRAL_SPLIT_RUN_STACK_SIZE=768
