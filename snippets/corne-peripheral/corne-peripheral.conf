# Right hand = peripheral (the secondary half)
#
# Pulled in via `snippets:` of every right-hand variant in build.yaml (`-S corne-peripheral`).
#
# ⚠️ Do not set ZMK_STUDIO / ZMK_STUDIO_RPC / any *_STUDIO_RPC here:
#    Studio's protobuf stubs are generated on the central only; enabling these on the right
#    half fails the build with a missing proto/zmk/custom.pb.h.
#    Nor in config/corne.conf shared by both halves — it would then apply to every build, including the right half.

#
# Device settings: receive and apply setting changes relayed from the central
# https://github.com/cormoran/zmk-module-settings-rpc
#
CONFIG_ZMK_SETTINGS_RPC=y

#
# Custom settings: relay receiver side
# https://github.com/cormoran/zmk-feature-custom-settings
#
CONFIG_ZMK_CUSTOM_SETTINGS=y
CONFIG_ZMK_CUSTOM_SETTINGS_SPLIT_RPC_RELAY=y

# Note: everything else (keyboard name, BT TX power, battery reporting, sleep,
# ZMK_SPLIT_RELAY_EVENT, thread stacks, etc.) is shared by both halves, in config/corne.conf.
# Central-only Studio / OS detection / default layer / extension modules
# all live in boards/shields/corne/corne_left.conf.
